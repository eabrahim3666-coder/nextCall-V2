<text x="201" y="433" font-size="19.5" font-weight="650" fill="#101010">Open the marketing site /</text>
<text x="201" y="460" font-size="14" fill="#101010">Client component: SceneStack of 11 scroll scenes, Lenis smooth scroll, ScrollProgress bar,</text>
<text x="201" y="480" font-size="14" fill="#101010">Section3D depth.</text>
<rect x="889" y="402" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="433" font-size="19.5" font-weight="650" fill="#101010">Jump to a section</text>
<text x="904" y="460" font-size="14" fill="#101010">Desktop anchor links + SmoothScroll; every scene wrapper id is unique so getElementById</text>
<text x="904" y="480" font-size="14" fill="#101010">stays unambiguous.</text>
<rect x="1592" y="402" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="433" font-size="19.5" font-weight="650" fill="#101010">Arrive via referral link ?ref=CODE</text>
<text x="1607" y="460" font-size="14" fill="#101010">Read via URLSearchParams after mount to avoid a hydration mismatch; the code rides into the</text>
<text x="1607" y="480" font-size="14" fill="#101010">Paddle checkout custom_data.</text>
<rect x="186" y="551" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="582" font-size="19.5" font-weight="650" fill="#101010">Ask a question / request a feature</text>
<text x="201" y="609" font-size="14" fill="#101010">POST /api/contact: honeypot field, 3 req/IP/min limit, escaped HTML email via Resend. POST</text>
<text x="201" y="629" font-size="14" fill="#101010">/api/feature-request stores the idea.</text>
<rect x="889" y="551" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="582" font-size="19.5" font-weight="650" fill="#101010">Read privacy / terms / pricing policy</text>
<text x="904" y="609" font-size="14" fill="#101010">/privacy, /terms, /pricing-policy, /google-user-data — public on purpose: Paddle and Google</text>
<text x="904" y="629" font-size="14" fill="#101010">both require disclosure pages.</text>
<rect x="1592" y="551" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="582" font-size="19.5" font-weight="650" fill="#101010">Sign up or sign in</text>
<text x="1607" y="609" font-size="14" fill="#101010">Clerk modal from ClerkProvider in app/layout.tsx; the session cookie authorises every</text>
<text x="1607" y="629" font-size="14" fill="#101010">protected route and API call.</text>
<rect x="186" y="700" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="731" font-size="19.5" font-weight="650" fill="#101010">Edge gate: Clerk middleware</text>
<text x="201" y="758" font-size="14" fill="#101010">proxy.ts (Next 16's renamed middleware). Public allowlist; everything else calls</text>
<text x="201" y="778" font-size="14" fill="#101010">auth().protect() before it runs.</text>
<rect x="889" y="700" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="731" font-size="19.5" font-weight="650" fill="#101010">Server guard on the dashboard shell</text>
<text x="904" y="758" font-size="14" fill="#101010">dashboard/layout.tsx: auth() → redirect without a session; loads the tenant doc, trial state</text>
<text x="904" y="778" font-size="14" fill="#101010">and the minutes maths.</text>
<rect x="1592" y="700" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="731" font-size="19.5" font-weight="650" fill="#101010">Access gate picks one of four states</text>
<text x="1607" y="758" font-size="14" fill="#101010">No doc → OnboardingFlow · Paddle success → Waiting · Trial over → TrialEndedScreen · Not</text>
<text x="1607" y="778" font-size="14" fill="#101010">active → Paywall · Active → dashboard.</text>
<rect x="186" y="937" width="677" height="73" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="968" font-size="19.5" font-weight="650" fill="#101010">Fill the onboarding wizard</text>
<text x="201" y="995" font-size="14" fill="#101010">Business name, owner name, phone, type, industry, hours, services and free-form notes.</text>
<rect x="889" y="937" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="968" font-size="19.5" font-weight="650" fill="#101010">POST /api/business/onboard</text>
<text x="904" y="995" font-size="14" fill="#101010">Owner email read server-side from Clerk; document upserted on business_id = userId, so a</text>
<text x="904" y="1015" font-size="14" fill="#101010">resubmit can never create a second tenant.</text>
<rect x="1592" y="937" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="968" font-size="19.5" font-weight="650" fill="#101010">businesses doc is created</text>
<text x="1607" y="995" font-size="14" fill="#101010">Status pending, six answers compiled into knowledge_base_text, referral_code generated,</text>
<text x="1607" y="1015" font-size="14" fill="#101010">counters zeroed — the root every feature keys off.</text>
<rect x="186" y="1174" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="1205" font-size="19.5" font-weight="650" fill="#101010">Choose a plan in the Paywall</text>
<text x="201" y="1232" font-size="14" fill="#101010">Trial 3 days / 50 min · standard 200 min $299 · premium 500 min $399 — plus an optional</text>
<text x="201" y="1252" font-size="14" fill="#101010">referral code.</text>
<rect x="889" y="1174" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="1205" font-size="19.5" font-weight="650" fill="#101010">POST /api/checkout/paddle</text>
<text x="904" y="1232" font-size="14" fill="#101010">Plan mapped to a PADDLE_*_PRICE_ID on the server, so no client can post a cheaper price id.</text>
<text x="904" y="1252" font-size="14" fill="#101010">custom_data carries user, plan, ref.</text>
<rect x="1592" y="1174" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="1205" font-size="19.5" font-weight="650" fill="#101010">Paddle overlay checkout</text>
<text x="1607" y="1232" font-size="14" fill="#101010">Paddle creates the transaction and opens it as an overlay — card data never touches our</text>
<text x="1607" y="1252" font-size="14" fill="#101010">servers.</text>
<rect x="2295" y="1174" width="677" height="73" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="1205" font-size="19.5" font-weight="650" fill="#101010">Pay, return ?paddle=success</text>
<text x="2310" y="1232" font-size="14" fill="#101010">On success Paddle redirects back with a transaction id.</text>
<rect x="186" y="1323" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="1354" font-size="19.5" font-weight="650" fill="#101010">Waiting screen polls activation</text>
<text x="201" y="1381" font-size="14" fill="#101010">GET /api/business/status → verifyPaidTransaction() checks Paddle directly and requires a</text>
<text x="201" y="1401" font-size="14" fill="#101010">session match + completed status.</text>
<rect x="889" y="1323" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="1354" font-size="19.5" font-weight="650" fill="#101010">Tenant goes active</text>
<text x="904" y="1381" font-size="14" fill="#101010">Status active, plan_type, minutes_limit 50/200/500, trial window, paddle_customer_id +</text>
<text x="904" y="1401" font-size="14" fill="#101010">subscription id stored.</text>
<rect x="1592" y="1323" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="1354" font-size="19.5" font-weight="650" fill="#101010">POST /api/webhooks/paddle</text>
<text x="1607" y="1381" font-size="14" fill="#101010">HMAC signature with a 5-min replay window; webhook_events ledger gives idempotency. This is</text>
<text x="1607" y="1401" font-size="14" fill="#101010">the AUTHORITATIVE activation.</text>
<rect x="2295" y="1323" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="1354" font-size="19.5" font-weight="650" fill="#101010">Webhook event router</text>
<text x="2310" y="1381" font-size="14" fill="#101010">created|activated → activate · updated → reconcile plan from price id · canceled/expired →</text>
<text x="2310" y="1401" font-size="14" fill="#101010">cancelled + 30-day deletion · minutes → $inc.</text>
<rect x="186" y="1472" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="1503" font-size="19.5" font-weight="650" fill="#101010">provisionTwilioNumber()</text>
<text x="201" y="1530" font-size="14" fill="#101010">Reuse the deterministic subaccount (a retry never bills twice) or create it; buy a US</text>
<text x="201" y="1550" font-size="14" fill="#101010">toll-free number with voice + SMS webhooks wired.</text>
<rect x="889" y="1472" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="1503" font-size="19.5" font-weight="650" fill="#101010">Subaccount + number stored</text>
<text x="904" y="1530" font-size="14" fill="#101010">twilio_subaccount_sid, twilio_number, twilio_numbers[]; a failure writes PROVISIONING_FAILED</text>
<text x="904" y="1550" font-size="14" fill="#101010">so later code can self-heal.</text>
<rect x="1592" y="1472" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="1503" font-size="19.5" font-weight="650" fill="#101010">Referral bonus credited</text>
<text x="1607" y="1530" font-size="14" fill="#101010">+40 / +70 minutes via an atomic not-yet-claimed guard — concurrent events cannot</text>
<text x="1607" y="1550" font-size="14" fill="#101010">double-credit; self-referral blocked; founder alerted.</text>
<rect x="2295" y="1472" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="1503" font-size="19.5" font-weight="650" fill="#101010">Buy extra minutes mid-cycle</text>
<text x="2310" y="1530" font-size="14" fill="#101010">POST /api/checkout/paddle-minutes: 50-min packs capped at plan limit, blocked on trial.</text>
<text x="2310" y="1550" font-size="14" fill="#101010">Calls PAUSE at the limit — no overage billing.</text>
<rect x="186" y="1621" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="1652" font-size="19.5" font-weight="650" fill="#101010">Manage billing / cancel</text>
<text x="201" y="1679" font-size="14" fill="#101010">POST /api/billing/portal opens the Paddle customer portal; cancelling → 30-day grace, then</text>
<text x="201" y="1699" font-size="14" fill="#101010">the cleanup cron closes everything.</text>
<rect x="889" y="1621" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="1652" font-size="19.5" font-weight="650" fill="#101010">Trial runs out — nothing to click</text>
<text x="904" y="1679" font-size="14" fill="#101010">isTrialExpired() rejects calls and texts on the first request past trial_ends_at; the hourly</text>
<text x="904" y="1699" font-size="14" fill="#101010">cron flips status and emails the owner.</text>
<rect x="186" y="1858" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="1889" font-size="19.5" font-weight="650" fill="#101010">Open /dashboard</text>
<text x="201" y="1916" font-size="14" fill="#101010">RSC reads the business doc + latest 50 calls; withRetry degrades a flaky Astra read to an</text>
<text x="201" y="1936" font-size="14" fill="#101010">empty list instead of a 500.</text>
<rect x="889" y="1858" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="1889" font-size="19.5" font-weight="650" fill="#101010">Read the KPI cards</text>
<text x="904" y="1916" font-size="14" fill="#101010">Calls, minutes, appointments, hot leads — all derived from the calls array the RSC already</text>
<text x="904" y="1936" font-size="14" fill="#101010">loaded; zero extra queries.</text>
<rect x="1592" y="1858" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="1889" font-size="19.5" font-weight="650" fill="#101010">Read the charts</text>
<text x="1607" y="1916" font-size="14" fill="#101010">7-day call volume + sentiment donut; premium swaps in PremiumAnalytics: revenue, average job</text>
<text x="1607" y="1936" font-size="14" fill="#101010">value, quote tracking.</text>
<rect x="2295" y="1858" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="1889" font-size="19.5" font-weight="650" fill="#101010">Scan the recent calls list</text>
<text x="2310" y="1916" font-size="14" fill="#101010">Five most recent calls with sentiment / lead / appointment / emergency badges, deep-linking</text>
<text x="2310" y="1936" font-size="14" fill="#101010">into /dashboard/calls.</text>
<rect x="186" y="2007" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="2038" font-size="19.5" font-weight="650" fill="#101010">Check your AI numbers</text>
<text x="201" y="2065" font-size="14" fill="#101010">Rendered from twilio_numbers, filtering out the PROVISIONING_FAILED sentinel so the owner</text>
<text x="201" y="2085" font-size="14" fill="#101010">never sees a fake number.</text>
<rect x="889" y="2007" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="2038" font-size="19.5" font-weight="650" fill="#101010">Open the notification bell</text>
<text x="904" y="2065" font-size="14" fill="#101010">GET /api/notifications (50 latest + unread), PATCH mark_read / mark_all_read, DELETE single.</text>
<text x="904" y="2085" font-size="14" fill="#101010">8 types incl. hot_lead, emergency.</text>
<rect x="1592" y="2007" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="2038" font-size="19.5" font-weight="650" fill="#101010">Watch the minutes counter</text>
<text x="1607" y="2065" font-size="14" fill="#101010">Used / limit from the business doc; at the limit it points at Settings → Billing to buy a</text>
<text x="1607" y="2085" font-size="14" fill="#101010">pack or upgrade.</text>
<rect x="2295" y="2007" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="2038" font-size="19.5" font-weight="650" fill="#101010">Check the AI status pill</text>
<text x="2310" y="2065" font-size="14" fill="#101010">Lit only when status active ∧ total_minutes_used &lt; limit — the same condition the inbound</text>
<text x="2310" y="2085" font-size="14" fill="#101010">call route enforces.</text>
<rect x="186" y="2156" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="2187" font-size="19.5" font-weight="650" fill="#101010">Work the setup checklist</text>
<text x="201" y="2214" font-size="14" fill="#101010">10 weighted items (profile … job value) deep-linking to settings?focus=…; the widget hides</text>
<text x="201" y="2234" font-size="14" fill="#101010">itself at 100%.</text>
<rect x="889" y="2156" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="2187" font-size="19.5" font-weight="650" fill="#101010">Watch the live activity feed</text>
<text x="904" y="2214" font-size="14" fill="#101010">Subscribes to Pusher private-business-{id}: incoming_call, ai_answered,</text>
<text x="904" y="2234" font-size="14" fill="#101010">appointment_confirmed, hot_lead, emergency, minute alerts…</text>
<rect x="1592" y="2156" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="2187" font-size="19.5" font-weight="650" fill="#101010">Realtime channel authorisation</text>
<text x="1607" y="2214" font-size="14" fill="#101010">POST /api/pusher/auth signs only private-business-{userId} for the signed-in user — no</text>
<text x="1607" y="2234" font-size="14" fill="#101010">tenant can subscribe to another's feed.</text>
<rect x="2295" y="2156" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="2187" font-size="19.5" font-weight="650" fill="#101010">Navigate Calls / Settings / Docs</text>
<text x="2310" y="2214" font-size="14" fill="#101010">Desktop NavLinks + MobileNav; footer links to /dashboard/docs, /dashboard/support and the</text>
<text x="2310" y="2234" font-size="14" fill="#101010">in-app legal pages.</text>
<rect x="186" y="2393" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="2424" font-size="19.5" font-weight="650" fill="#101010">Open /dashboard/calls</text>
<text x="201" y="2451" font-size="14" fill="#101010">CallLogsTable renders the 50 most recent calls; rows are keyboard-accessible with duration,</text>
<text x="201" y="2471" font-size="14" fill="#101010">source and state badges.</text>
<rect x="889" y="2393" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="2424" font-size="19.5" font-weight="650" fill="#101010">Read a transcript / summary</text>
<text x="904" y="2451" font-size="14" fill="#101010">Everything the analyst model extracted sits on the call: transcript, summary, sentiment,</text>
<text x="904" y="2471" font-size="14" fill="#101010">lead_quality, quote, recording_url.</text>
<rect x="1592" y="2393" width="677" height="73" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="2424" font-size="19.5" font-weight="650" fill="#101010">Flag or unflag a call</text>
<text x="1607" y="2451" font-size="14" fill="#101010">POST /api/calls/toggle-flag flips is_flagged — a shortlist of leads worth chasing.</text>
<rect x="186" y="2542" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="2573" font-size="19.5" font-weight="650" fill="#101010">Mark the job done</text>
<text x="201" y="2600" font-size="14" fill="#101010">Sets job_status done, feeds the AI context list, then fires the review request (email first,</text>
<text x="201" y="2620" font-size="14" fill="#101010">SMS fallback). A second click → 409.</text>
<rect x="889" y="2542" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="2573" font-size="19.5" font-weight="650" fill="#101010">Mark a no-show</text>
<text x="904" y="2600" font-size="14" fill="#101010">job_status no_show stops the 24h auto-completion cron treating it as completed — no review</text>
<text x="904" y="2620" font-size="14" fill="#101010">request goes out.</text>
<rect x="1592" y="2542" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="2573" font-size="19.5" font-weight="650" fill="#101010">Nothing clicked — the cron closes the loop</text>
<text x="1607" y="2600" font-size="14" fill="#101010">The hourly follow-up finds booked jobs 24h past and still pending, marks them auto_done and</text>
<text x="1607" y="2620" font-size="14" fill="#101010">sends the review request.</text>
<rect x="186" y="2779" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="2810" font-size="19.5" font-weight="650" fill="#101010">Open /dashboard/settings</text>
<text x="201" y="2837" font-size="14" fill="#101010">SettingsForm honours ?focus=business|knowledge|greeting|routing|integrations|sms|billing —</text>
<text x="201" y="2857" font-size="14" fill="#101010">the checklist's deep links.</text>
<rect x="889" y="2779" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="2810" font-size="19.5" font-weight="650" fill="#101010">POST /api/business/update-settings</text>
<text x="904" y="2837" font-size="14" fill="#101010">One write path for the whole profile; validates before storing: timezone must round-trip</text>
<text x="904" y="2857" font-size="14" fill="#101010">Intl, review link https, webhook SSRF guard.</text>
<rect x="1592" y="2779" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="2810" font-size="19.5" font-weight="650" fill="#101010">Edit name, type, service area, owner phone</text>
<text x="1607" y="2837" font-size="14" fill="#101010">Feeds the AI's answers, the owner-SMS target, the dashboard header and every outgoing email</text>
<text x="1607" y="2857" font-size="14" fill="#101010">signature.</text>
<rect x="2295" y="2779" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="2810" font-size="19.5" font-weight="650" fill="#101010">Set hours, services, exclusions, FAQs</text>
<text x="2310" y="2837" font-size="14" fill="#101010">Compiled into knowledge_base_text — the exact string injected into the voice prompt and the</text>
<text x="2310" y="2857" font-size="14" fill="#101010">SMS brain.</text>
<rect x="186" y="2928" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="2959" font-size="19.5" font-weight="650" fill="#101010">Set greeting tone, text and AI name</text>
<text x="201" y="2986" font-size="14" fill="#101010">Sent as Retell dynamic variables so the AI introduces itself the way the owner wants on</text>
<text x="201" y="3006" font-size="14" fill="#101010">every call.</text>
<rect x="889" y="2928" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="2959" font-size="19.5" font-weight="650" fill="#101010">Toggle routing rules</text>
<text x="904" y="2986" font-size="14" fill="#101010">forward_emergency, hot-lead notify, missed-call SMS, follow-ups, summaries, reminders —</text>
<text x="904" y="3006" font-size="14" fill="#101010">plan-gated again on the server.</text>
<rect x="1592" y="2928" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="2959" font-size="19.5" font-weight="650" fill="#101010">Define what counts as an emergency</text>
<text x="1607" y="2986" font-size="14" fill="#101010">Injected into the agent prompt; drives the transfer_call tool + the emergency webhook</text>
<text x="1607" y="3006" font-size="14" fill="#101010">fan-out.</text>
<rect x="2295" y="2928" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="2959" font-size="19.5" font-weight="650" fill="#101010">Set review link + average job value</text>
<text x="2310" y="2986" font-size="14" fill="#101010">review_link is the destination of every review request; avg_job_value (premium) unlocks the</text>
<text x="2310" y="3006" font-size="14" fill="#101010">revenue analytics.</text>
<rect x="186" y="3077" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="3108" font-size="19.5" font-weight="650" fill="#101010">Add a Zapier / automation webhook</text>
<text x="201" y="3135" font-size="14" fill="#101010">Premium only; stored only after isSafeWebhookUrl() proves public https — blocking SSRF from</text>
<text x="201" y="3155" font-size="14" fill="#101010">our own servers.</text>
<rect x="889" y="3077" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="3108" font-size="19.5" font-weight="650" fill="#101010">Add or remove a phone number</text>
<text x="904" y="3135" font-size="14" fill="#101010">POST /api/numbers/add: premium, max 3, self-heals a missing line first; remove releases it</text>
<text x="904" y="3155" font-size="14" fill="#101010">back to Twilio.</text>
<rect x="1592" y="3077" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="3108" font-size="19.5" font-weight="650" fill="#101010">Share your referral code</text>
<text x="1607" y="3135" font-size="14" fill="#101010">POST /api/business/referral-code returns the onboarding code; a referral signup credits +40</text>
<text x="1607" y="3155" font-size="14" fill="#101010">/ +70 minutes back here.</text>
<rect x="2295" y="3077" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="3108" font-size="19.5" font-weight="650" fill="#101010">Open the SMS compliance tab</text>
<text x="2310" y="3135" font-size="14" fill="#101010">GET /api/sms/compliance: 20+ field prefilled Toll-Free Verification form + status, lazily</text>
<text x="2310" y="3155" font-size="14" fill="#101010">refreshed from Twilio at most every 6h.</text>
<rect x="186" y="3226" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="3257" font-size="19.5" font-weight="650" fill="#101010">POST /api/sms/compliance</text>
<text x="201" y="3284" font-size="14" fill="#101010">Validates every field, then submitTollfreeVerification(); Twilio auth failures retry through</text>
<text x="201" y="3304" font-size="14" fill="#101010">the recovery engine, not a dead form.</text>
<rect x="889" y="3226" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="3257" font-size="19.5" font-weight="650" fill="#101010">Twilio reviews the verification</text>
<text x="904" y="3284" font-size="14" fill="#101010">pending → approved | rejected with reasons mirrored back. This single flag unlocks ALL</text>
<text x="904" y="3304" font-size="14" fill="#101010">outbound texting.</text>
<rect x="186" y="3463" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="3494" font-size="19.5" font-weight="650" fill="#101010">Click Connect Google</text>
<text x="201" y="3521" font-size="14" fill="#101010">CSRF state in an httpOnly cookie; offline access + consent to force a refresh token;</text>
<text x="201" y="3541" font-size="14" fill="#101010">calendar + business scopes.</text>
<rect x="889" y="3463" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="3494" font-size="19.5" font-weight="650" fill="#101010">Google consent → callback</text>
<text x="904" y="3521" font-size="14" fill="#101010">State compared and deleted, code exchanged, refresh token + account email stored, redirected</text>
<text x="904" y="3541" font-size="14" fill="#101010">back ?connected=1.</text>
<rect x="1592" y="3463" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="3494" font-size="19.5" font-weight="650" fill="#101010">What the token unlocks</text>
<text x="1607" y="3521" font-size="14" fill="#101010">Calendar events from booked appointments (all plans) + hourly Google Reviews sync with AI</text>
<text x="1607" y="3541" font-size="14" fill="#101010">replies (paid). Token faults auto-heal.</text>
<rect x="2295" y="3463" width="677" height="73" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="3494" font-size="19.5" font-weight="650" fill="#101010">Connect Facebook / Instagram</text>
<text x="2310" y="3521" font-size="14" fill="#101010">CSRF state cookie + scopes for pages, messaging, Instagram messages and engagement.</text>
<rect x="186" y="3612" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="3643" font-size="19.5" font-weight="650" fill="#101010">FB dialog → callback</text>
<text x="201" y="3670" font-size="14" fill="#101010">Short-lived → long-lived token, page list with portfolio fallback, primary page token,</text>
<text x="201" y="3690" font-size="14" fill="#101010">Instagram business account + picture stored.</text>
<rect x="889" y="3612" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="3643" font-size="19.5" font-weight="650" fill="#101010">Disconnect an integration</text>
<text x="904" y="3670" font-size="14" fill="#101010">POST …/disconnect clears stored tokens — calendar writes and DM replies stop instantly,</text>
<text x="904" y="3690" font-size="14" fill="#101010">cards show disconnected.</text>
<rect x="186" y="3849" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="3880" font-size="19.5" font-weight="650" fill="#101010">Open the chat widget</text>
<text x="201" y="3907" font-size="14" fill="#101010">Premium tenants; history from GET /api/chat/history; POST /api/chat/read clears the unread</text>
<text x="201" y="3927" font-size="14" fill="#101010">badge.</text>
<rect x="889" y="3849" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="3880" font-size="19.5" font-weight="650" fill="#101010">Send a message or a photo</text>
<text x="904" y="3907" font-size="14" fill="#101010">POST /api/chat/send: 2000-char cap, 2MB photo cap, server-side message ids so ordering</text>
<text x="904" y="3927" font-size="14" fill="#101010">survives retries.</text>
<rect x="1592" y="3849" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="3880" font-size="19.5" font-weight="650" fill="#101010">Staff pinged on Telegram</text>
<text x="1607" y="3907" font-size="14" fill="#101010">notifyAdminChat() sends the escaped message and stores the returned Telegram message_id on</text>
<text x="1607" y="3927" font-size="14" fill="#101010">the message — the reply join key.</text>
<rect x="2295" y="3849" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="3880" font-size="19.5" font-weight="650" fill="#101010">Thread upserted + pushed live</text>
<text x="2310" y="3907" font-size="14" fill="#101010">conversations{kind:support} gets $push, unread reset, and chat:new fires on</text>
<text x="2310" y="3927" font-size="14" fill="#101010">private-admin-chat so /admin/chat animates instantly.</text>
<rect x="186" y="3998" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="4029" font-size="19.5" font-weight="650" fill="#101010">Staff replies in /admin/chat</text>
<text x="201" y="4056" font-size="14" fill="#101010">POST /api/admin/chat/reply appends an owner-role message and notifies — the widget receives</text>
<text x="201" y="4076" font-size="14" fill="#101010">it in real time, no polling.</text>
<rect x="889" y="3998" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="4029" font-size="19.5" font-weight="650" fill="#101010">Staff replies inside Telegram instead</text>
<text x="904" y="4056" font-size="14" fill="#101010">POST /api/webhooks/telegram: secret-token + sender check, reply_to_message_id resolved back</text>
<text x="904" y="4076" font-size="14" fill="#101010">to the thread, then pushed to the widget.</text>
<rect x="186" y="4235" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="4266" font-size="19.5" font-weight="650" fill="#101010">Customer calls your AI number</text>
<text x="201" y="4293" font-size="14" fill="#101010">Twilio hits POST /api/webhooks/twilio/inbound; X-Twilio-Signature validated so nobody spoofs</text>
<text x="201" y="4313" font-size="14" fill="#101010">a call into your minutes.</text>
<rect x="889" y="4235" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="4266" font-size="19.5" font-weight="650" fill="#101010">Four guards before any AI runs</text>
<text x="904" y="4293" font-size="14" fill="#101010">Agent id missing → loud alert · tenant not found → polite TwiML · trial expired →</text>
<text x="904" y="4313" font-size="14" fill="#101010">unavailable + notification · minutes spent → missed-lead alert.</text>
<rect x="1592" y="4235" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="4266" font-size="19.5" font-weight="650" fill="#101010">registerPhoneCall + tenant prompt</text>
<text x="1607" y="4293" font-size="14" fill="#101010">Retell registered with business_id metadata and dynamic variables — multi-tenant isolation</text>
<text x="1607" y="4313" font-size="14" fill="#101010">is per-call, not per-deployment.</text>
<rect x="2295" y="4235" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="4266" font-size="19.5" font-weight="650" fill="#101010">Voice prompt assembled</text>
<text x="2310" y="4293" font-size="14" fill="#101010">Knowledge base, greeting, tone, routing rules, emergency definition, live name + service</text>
<text x="2310" y="4313" font-size="14" fill="#101010">area — bound into this single call.</text>
<rect x="186" y="4384" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="4415" font-size="19.5" font-weight="650" fill="#101010">TwiML dials Retell over SIP</text>
<text x="201" y="4442" font-size="14" fill="#101010">The route answers with Dial Sip sip:{call_id}@sip.retellai.com — which is why the emergency</text>
<text x="201" y="4462" font-size="14" fill="#101010">path rewrites live TwiML.</text>
<rect x="889" y="4384" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="4415" font-size="19.5" font-weight="650" fill="#101010">Emergency — the agent calls transfer_call</text>
<text x="904" y="4442" font-size="14" fill="#101010">HMAC-verified webhook: urgent SMS + live dashboard toast, then the LIVE call's TwiML</text>
<text x="904" y="4462" font-size="14" fill="#101010">rewritten to bridge the owner; fail → founder paged.</text>
<rect x="1592" y="4384" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="4415" font-size="19.5" font-weight="650" fill="#101010">Customer hangs up</text>
<text x="1607" y="4442" font-size="14" fill="#101010">POST /api/webhooks/retell/call-ended: signature + in-flight window + call_id dedupe — a</text>
<text x="1607" y="4462" font-size="14" fill="#101010">retry can never double-count minutes.</text>
<rect x="2295" y="4384" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="4415" font-size="19.5" font-weight="650" fill="#101010">One model call turns talk into data</text>
<text x="2310" y="4442" font-size="14" fill="#101010">gpt-4o-mini in JSON mode: summary, sentiment, lead_quality, appointment, email + name,</text>
<text x="2310" y="4462" font-size="14" fill="#101010">is_emergency, duration, quote + amount.</text>
<rect x="186" y="4533" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="4564" font-size="19.5" font-weight="650" fill="#101010">Call row written + minutes debited</text>
<text x="201" y="4591" font-size="14" fill="#101010">$inc total_minutes_used + calls atomically (race-safe); the full call document is stored</text>
<text x="201" y="4611" font-size="14" fill="#101010">with job_status pending.</text>
<rect x="889" y="4533" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="4564" font-size="19.5" font-weight="650" fill="#101010">Post-call automations fire in parallel</text>
<text x="904" y="4591" font-size="14" fill="#101010">Calendar event, Zapier (premium), follow-up email, hot-lead + emergency alerts, missed-call</text>
<text x="904" y="4611" font-size="14" fill="#101010">SMS &lt;10s, 80/90/100% minute alerts — all guarded.</text>
<rect x="1592" y="4533" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="4564" font-size="19.5" font-weight="650" fill="#101010">Google Calendar event created</text>
<text x="1607" y="4591" font-size="14" fill="#101010">Naive local time converted via business_timezone; midnight → 10:00 local; a 401/403</text>
<text x="1607" y="4611" font-size="14" fill="#101010">refreshes the token and retries once.</text>
<rect x="186" y="4770" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="4801" font-size="19.5" font-weight="650" fill="#101010">Customer texts your number</text>
<text x="201" y="4828" font-size="14" fill="#101010">POST /api/webhooks/twilio/sms-inbound, signature verified. Same handler serves WhatsApp —</text>
<text x="201" y="4848" font-size="14" fill="#101010">prefix stripped, re-applied on the reply.</text>
<rect x="889" y="4770" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="4801" font-size="19.5" font-weight="650" fill="#101010">TCPA opt-out runs FIRST</text>
<text x="904" y="4828" font-size="14" fill="#101010">STOP-family keywords confirmed and recorded before any gate; START clears. A customer can</text>
<text x="904" y="4848" font-size="14" fill="#101010">always opt out, whatever the account state.</text>
<rect x="1592" y="4770" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="4801" font-size="19.5" font-weight="650" fill="#101010">Trial + abuse gates</text>
<text x="1607" y="4828" font-size="14" fill="#101010">Expired trial → one polite 'no longer active' reply; otherwise 25 messages/hour per customer</text>
<text x="1607" y="4848" font-size="14" fill="#101010">stops a runaway loop burning AI credits.</text>
<rect x="2295" y="4770" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="4801" font-size="19.5" font-weight="650" fill="#101010">SMS brain with real tools</text>
<text x="2310" y="4828" font-size="14" fill="#101010">gpt-4o-mini + knowledge + thread history can book, confirm, reschedule or cancel</text>
<text x="2310" y="4848" font-size="14" fill="#101010">appointments — writing straight to the calls collection.</text>
<rect x="186" y="4919" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="4950" font-size="19.5" font-weight="650" fill="#101010">Reply through one choke point</text>
<text x="201" y="4977" font-size="14" fill="#101010">sendBusinessSms() enforces three things at once: TFV approved, not opted out, and the</text>
<text x="201" y="4997" font-size="14" fill="#101010">business's OWN subaccount as sending scope.</text>
<rect x="889" y="4919" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="4950" font-size="19.5" font-weight="650" fill="#101010">Gated until TFV is approved</text>
<text x="904" y="4977" font-size="14" fill="#101010">Before Toll-Free Verification approval, sends are logged and skipped — which is why the</text>
<text x="904" y="4997" font-size="14" fill="#101010">compliance tab is step 8 of the checklist.</text>
<rect x="1592" y="4919" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="4950" font-size="19.5" font-weight="650" fill="#101010">Customer DMs your Facebook / Instagram</text>
<text x="1607" y="4977" font-size="14" fill="#101010">POST /api/webhooks/meta/inbound: x-hub-signature-256 verified, per-sender idempotency,</text>
<text x="1607" y="4997" font-size="14" fill="#101010">matched on meta_page_id, premium only.</text>
<rect x="2295" y="4919" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="4950" font-size="19.5" font-weight="650" fill="#101010">3-second human buffer</text>
<text x="2310" y="4977" font-size="14" fill="#101010">Waits 3s and re-reads the thread: a newer message aborts the reply — three typed lines get</text>
<text x="2310" y="4997" font-size="14" fill="#101010">ONE answer, never three.</text>
<rect x="186" y="5068" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="5099" font-size="19.5" font-weight="650" fill="#101010">JSON brain + hard safety overrides</text>
<text x="201" y="5126" font-size="14" fill="#101010">Intent, sentiment, confidence, action + reply; then deterministic overrides: low confidence,</text>
<text x="201" y="5146" font-size="14" fill="#101010">anger or emergency always escalates.</text>
<rect x="889" y="5068" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="5099" font-size="19.5" font-weight="650" fill="#101010">Reply sent through the Graph API</text>
<text x="904" y="5126" font-size="14" fill="#101010">Reply + new conversation state persisted, then posted to the page's send endpoint with the</text>
<text x="904" y="5146" font-size="14" fill="#101010">stored page token.</text>
<rect x="1592" y="5068" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="5099" font-size="19.5" font-weight="650" fill="#101010">Review request after the work is done</text>
<text x="1607" y="5126" font-size="14" fill="#101010">sendReviewRequest(): email first, SMS fallback — the SMS path TFV-gated like everything</text>
<text x="1607" y="5146" font-size="14" fill="#101010">else; only when a review link is configured.</text>
<rect x="2295" y="5068" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="5099" font-size="19.5" font-weight="650" fill="#101010">Appointment reminder — reply 1 / 2 / 3</text>
<text x="2310" y="5126" font-size="14" fill="#101010">Hourly cron emails then texts the customer in the business's timezone, marked sent so it</text>
<text x="2310" y="5146" font-size="14" fill="#101010">never repeats; replies hit the booking tools.</text>
<rect x="186" y="5305" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="5336" font-size="19.5" font-weight="650" fill="#101010">Hourly jobs (GitHub Actions)</text>
<text x="201" y="5363" font-size="14" fill="#101010">Bearer CRON_SECRET (timing-safe compare) hits appointment-reminders, job-done-followup,</text>
<text x="201" y="5383" font-size="14" fill="#101010">sync-reviews and expire-trials.</text>
<rect x="889" y="5305" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="5336" font-size="19.5" font-weight="650" fill="#101010">Daily + weekly jobs</text>
<text x="904" y="5363" font-size="14" fill="#101010">cleanup-cancelled 00:00 closes the Twilio subaccount FIRST (skips delete on failure),</text>
<text x="904" y="5383" font-size="14" fill="#101010">daily-summary 03:00, weekly-summary Monday.</text>
<rect x="1592" y="5305" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="5336" font-size="19.5" font-weight="650" fill="#101010">Google Reviews sync + AI replies</text>
<text x="1607" y="5363" font-size="14" fill="#101010">locations → v4 reviews; unreplied ones get a short SEO-aware gpt-4o-mini reply PUT back to</text>
<text x="1607" y="5383" font-size="14" fill="#101010">Google; also exposed to n8n behind x-api-key.</text>
<rect x="186" y="5454" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="5485" font-size="19.5" font-weight="650" fill="#101010">Resend email fan</text>
<text x="201" y="5512" font-size="14" fill="#101010">Daily/weekly summaries, trial + minute-limit notices, customer follow-ups, reminders, review</text>
<text x="201" y="5532" font-size="14" fill="#101010">requests — trouble never breaks a flow.</text>
<rect x="889" y="5454" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="5485" font-size="19.5" font-weight="650" fill="#101010">Pusher realtime</text>
<text x="904" y="5512" font-size="14" fill="#101010">private-business-{id} and private-admin-chat; notifyActivity()/notifyChat() never throw — an</text>
<text x="904" y="5532" font-size="14" fill="#101010">outage degrades to no toasts, never a failed call.</text>
<rect x="1592" y="5454" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="5485" font-size="19.5" font-weight="650" fill="#101010">Telegram ops bridge</text>
<text x="1607" y="5512" font-size="14" fill="#101010">One bot, two jobs: the owner-support bridge and the system alarm channel — provisioning</text>
<text x="1607" y="5532" font-size="14" fill="#101010">failures, bridge faults, HIGH/CRITICAL incidents.</text>
<rect x="2295" y="5454" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="5485" font-size="19.5" font-weight="650" fill="#101010">n8n boss alerts</text>
<text x="2310" y="5512" font-size="14" fill="#101010">Hot-lead and emergency events POSTed to N8N_BOSS_ALERT_URL for fan-out to any other channel</text>
<text x="2310" y="5532" font-size="14" fill="#101010">the owner runs.</text>
<rect x="186" y="5603" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="5634" font-size="19.5" font-weight="650" fill="#101010">Idempotency, retries and caps</text>
<text x="201" y="5661" font-size="14" fill="#101010">webhook_events dedupes Retell, Twilio, Paddle, Meta, Telegram; contact form rate-limited;</text>
<text x="201" y="5681" font-size="14" fill="#101010">SMS capped; withRetry wraps flaky Astra reads.</text>
<rect x="186" y="5840" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="5871" font-size="19.5" font-weight="650" fill="#101010">Open /admin</text>
<text x="201" y="5898" font-size="14" fill="#101010">Only privateMetadata.role=admin or ADMIN_EMAILS — backend-set signals; publicMetadata is</text>
<text x="201" y="5918" font-size="14" fill="#101010">never a trust anchor. Others → /dashboard.</text>
<rect x="889" y="5840" width="677" height="73" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="5871" font-size="19.5" font-weight="650" fill="#101010">Admin overview</text>
<text x="904" y="5898" font-size="14" fill="#101010">Tenants, usage, minutes and margin per plan via lib/costing, plus the incident counters.</text>
<rect x="1592" y="5840" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="5871" font-size="19.5" font-weight="650" fill="#101010">Support inbox</text>
<text x="1607" y="5898" font-size="14" fill="#101010">Threads from /api/admin/chat/list + /messages; the layout badge counts unread</text>
<text x="1607" y="5918" font-size="14" fill="#101010">(read_by_admin_at: null).</text>
<rect x="2295" y="5840" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="5871" font-size="19.5" font-weight="650" fill="#101010">Incident console</text>
<text x="2310" y="5898" font-size="14" fill="#101010">Filtered list (free text, provider, severity, status, operation, dates) + a detail page per</text>
<text x="2310" y="5918" font-size="14" fill="#101010">incident.</text>
<rect x="186" y="5989" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="6020" font-size="19.5" font-weight="650" fill="#101010">Act on an incident</text>
<text x="201" y="6047" font-size="14" fill="#101010">retry / resolve / recover / dismiss / requires_action. Retry only runs REGISTERED executors,</text>
<text x="201" y="6067" font-size="14" fill="#101010">refuses terminal states, inflight-guarded.</text>
<rect x="889" y="5989" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="6020" font-size="19.5" font-weight="650" fill="#101010">Recovery engine wraps provider calls</text>
<text x="904" y="6047" font-size="14" fill="#101010">executeWithRecovery(): normalize + redact, deterministic classification (no AI), bounded</text>
<text x="904" y="6067" font-size="14" fill="#101010">retry, then a policy-checked action. Depth ≤ 1.</text>
<rect x="1592" y="5989" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="6020" font-size="19.5" font-weight="650" fill="#101010">AI is a consultant, never an actor</text>
<text x="1607" y="6047" font-size="14" fill="#101010">Only unknown errors reach gpt-4o-mini, within a budget + fingerprint cache; the answer must</text>
<text x="1607" y="6067" font-size="14" fill="#101010">be a registry id re-checked by policy — else fail closed.</text>
<rect x="2295" y="5989" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="2310" y="6020" font-size="19.5" font-weight="650" fill="#101010">Incident + audit trail</text>
<text x="2310" y="6047" font-size="14" fill="#101010">Incidents aggregate by sha256 fingerprint with occurrence counts, a timeline, and every</text>
<text x="2310" y="6067" font-size="14" fill="#101010">policy evaluation kept as evidence.</text>
<rect x="186" y="6138" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="201" y="6169" font-size="19.5" font-weight="650" fill="#101010">Every inbound edge verifies its sender</text>
<text x="201" y="6196" font-size="14" fill="#101010">Twilio signature, Retell HMAC, Paddle HMAC, Meta x-hub-signature-256, Telegram secret token</text>
<text x="201" y="6216" font-size="14" fill="#101010">— all timing-safe, all fail closed.</text>
<rect x="889" y="6138" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="904" y="6169" font-size="19.5" font-weight="650" fill="#101010">SSRF, spam and prompt-safety guards</text>
<text x="904" y="6196" font-size="14" fill="#101010">Private-host block on user webhooks, honeypot + rate-limited contact form, deterministic</text>
<text x="904" y="6216" font-size="14" fill="#101010">overrides above every AI layer.</text>
<rect x="1592" y="6138" width="677" height="93" fill="none" stroke="#101010" stroke-width="1.3" rx="10"/>
<text x="1607" y="6169" font-size="19.5" font-weight="650" fill="#101010">Operational surfaces</text>
<text x="1607" y="6196" font-size="14" fill="#101010">GET /api/health for uptime monitors, structured [recovery] JSON logs, and a one-time warning</text>
<text x="1607" y="6216" font-size="14" fill="#101010">if recovery state falls back to memory.</text>
